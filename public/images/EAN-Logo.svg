<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none" width="100%" height="100%">
  <!-- EAN Aviation Master Vector Logo -->
  <g id="ean-logotype" fill="currentColor">
    <!-- 'e' -->
    <path d="M 68 142 C 34 142 12 118 12 84 C 12 50 35 26 68 26 C 100 26 122 49 122 83 C 122 87 121 91 120 94 L 28 94 C 30 117 46 130 68 130 C 82 130 94 123 102 112 L 118 122 C 106 135 89 142 68 142 Z M 68 38 C 47 38 32 51 28 82 L 106 82 C 103 52 88 38 68 38 Z" />
    
    <!-- 'a' -->
    <path d="M 198 140 L 183 140 L 183 126 C 174 136 161 142 145 142 C 122 142 105 127 105 104 C 105 81 123 68 152 68 C 163 68 174 70 183 74 L 183 71 C 183 52 171 40 151 40 C 137 40 126 46 119 55 L 107 43 C 117 31 133 26 153 26 C 183 26 198 44 198 75 L 198 140 Z M 183 89 C 175 85 166 82 155 82 C 135 82 122 91 122 104 C 122 118 133 127 148 127 C 166 127 183 113 183 96 L 183 89 Z" />

    <!-- 'n' -->
    <path d="M 220 28 L 235 28 L 235 48 C 245 34 260 26 278 26 C 305 26 319 43 319 72 L 319 140 L 304 140 L 304 74 C 304 52 294 40 274 40 C 255 40 235 55 235 78 L 235 140 L 220 140 L 220 28 Z" />
  </g>

  <!-- 'AVIATION' subline -->
  <g id="aviation-subline" fill="#A2A6A9" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="7">
    <text x="135" y="180">AVIATION</text>
  </g>

  <!-- Swirl Ribbon Flight Mark -->
  <g id="ean-mark">
    <!-- Back Silver/Grey Aero Arcs -->
    <path d="M 440 145 C 380 125 365 75 410 40 C 445 12 505 18 535 55 C 490 35 440 38 415 62 C 385 90 405 125 455 140 Z" fill="#B5B9BC" opacity="0.85" />
    <path d="M 425 155 C 390 145 375 110 415 80 C 460 45 520 60 550 95 C 510 75 460 70 430 95 C 405 115 415 140 445 152 Z" fill="#CFD3D6" opacity="0.65" />

    <!-- Primary Dynamic Ascending Ribbons & Arrow Jets -->
    <!-- Lower Loop & Jet -->
    <path d="M 405 130 C 375 155 390 195 440 195 C 495 195 545 145 585 55 L 575 75 C 540 135 490 180 445 180 C 410 180 395 155 418 135 Z" fill="currentColor" />
    <polygon points="585,55 560,78 578,82" fill="currentColor" />

    <!-- Middle Loop & Jet -->
    <path d="M 410 95 C 365 115 360 160 420 170 C 475 180 535 135 595 72 L 582 88 C 530 140 475 168 425 158 C 380 150 380 120 422 102 Z" fill="currentColor" />
    <polygon points="595,72 568,90 587,97" fill="currentColor" />

    <!-- Top Dominant Loop & Jet -->
    <path d="M 435 40 C 385 55 370 100 420 125 C 475 150 545 115 600 90 L 585 100 C 535 122 475 135 430 112 C 390 92 400 65 442 50 Z" fill="currentColor" />
    <polygon points="600,90 575,103 592,112" fill="currentColor" />
  </g>
</svg>
